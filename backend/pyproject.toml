[project]
name = "ai-study-platform-backend"
version = "0.1.0"
description = "REST API and background workers of AI Study Platform."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141",
    "pydantic-settings>=2.15",
    "structlog>=26.1",
    "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "S", "SIM", "C4", "RET", "PT", "RUF", "ARG", "PL"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ARG001"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib", "-ra", "--strict-markers", "--strict-config"]
markers = ["integration: needs PostgreSQL and Redis (TEST_DATABASE_URL, TEST_REDIS_URL)"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["app"]
branch = true
